import groovy.json.JsonSlurper

apply from: file('../location-sources.gradle')
apply from: file('../version.gradle')

tasks.register('testVersionAllocation') {
    doLast {
        def release = new JsonSlurper().parse(file('../version.json'))
        def allocated = cyclonValidateVersion(release, 40226)
        // Owner-reported installed baseline for this delivery; source checks do
        // not establish signing, installation or device acceptance.
        def installed = [gmsVersionCode: 254132096, vendingVersionCode: 84022699]
        def assertUpgradeFromInstalled = { Map candidate ->
            installed.each { name, code ->
                assert candidate[name] > code : "${name} must advance installed ${code}"
            }
        }
        assertUpgradeFromInstalled(allocated)
        // These are valid allocations but cannot replace the installed APKs.
        // Exercise each floor independently, including equality (no upgrade).
        installed.each { name, code ->
            [code - 1, code].each { staleCode ->
                def stale = cyclonValidateVersion(release + [(name): staleCode], 40226)
                boolean rejected = false
                try {
                    assertUpgradeFromInstalled(stale)
                } catch (AssertionError expected) {
                    rejected = true
                }
                assert rejected : "The installed-version floor accepted ${name}=${staleCode}"
            }
        }
        assert allocated.gmsCode == Integer.parseInt(release.reportedGmsVersion.replaceAll('\\.', ''))
        // Stay below Cloud Messaging's 26.12 gate until microG implements that service.
        assert allocated.gmsCode < 261200
        // First delivery after the exhausted FakeStore block is valid; neither
        // its compatibility version nor the reported GMS API version must rise.
        assert cyclonValidateVersion(release + [vendingVersionCode: 84022700], 40226).vendingVersionCode == 84022700
        [
            [format: 1],
            [reportedGmsVersion: '25.41'],
            [reportedGmsVersion: '25.20.32'],
            [gmsVersionCode: 252432076],
            [gmsVersionCode: (allocated.gmsCode * 1000 + 1000)],
            [vendingVersionCode: 84022634],
            [vendingVersionCode: 84022800],
            [gmsVersionCode: "${allocated.gmsVersionCode}"],
            [upstreamTag: 'v0.3.17']
        ].each { change ->
            try {
                cyclonValidateVersion(release + change, 40226)
                throw new AssertionError("An invalid APK version allocation was accepted: $change")
            } catch (GradleException expected) {
                assert expected.message.contains('allocation')
            }
        }
        println('Verified upgrade from the shipped APK versions, the Cloud Messaging ceiling and rejection of invalid allocations.')
    }
}

tasks.register('testLocationSources') {
    doLast {
        def pin = new JsonSlurper().parse(file('../location-sources.json'))
        File apk = file(providers.gradleProperty('upstreamApk').get())
        def rows = new JsonSlurper().parseText(cyclonLocationSourcesFromApk(apk, pin))
        assert rows.collect { it.id } == ['positon', 'beacondb', 'custom']
        assert rows[0].suggested
        assert new URI(rows[0].url).host == 'api.positon.xyz'
        assert new URI(rows[0].url).query.startsWith('key=')
        assert rows[0].import && rows[1].import && rows[2].import
        assert rows[1].allowContribute
        def badPin = new LinkedHashMap(pin)
        badPin.sha256 = '0' * 64
        try {
            cyclonLocationSourcesFromApk(apk, badPin)
            throw new AssertionError('An incorrect APK hash was accepted')
        } catch (GradleException expected) {
            assert expected.message.contains('hash differs')
        }
        badPin = new LinkedHashMap(pin)
        badPin.sizeBytes = pin.sizeBytes - 1
        try {
            cyclonLocationSourcesFromApk(apk, badPin)
            throw new AssertionError('An incorrect APK size was accepted')
        } catch (GradleException expected) {
            assert expected.message.contains('size differs')
        }
        println('Verified official provider choices, suggested Positon, contribution flags, and rejection of changed inputs.')
    }
}

tasks.register('testNotices', Exec) {
    commandLine 'python3', file('../notices/test_generate.py')
}
