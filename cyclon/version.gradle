import groovy.json.JsonSlurper

// Upstream gives every commit after a tag the same versionCode. Allocate each
// Cyclon delivery explicitly so Android can replace the previous signed APKs.
//
// reportedGmsVersion is the Play services version microG reports to apps and to
// Google's servers. Upstream's tag pins its own, older version; ours may be newer
// so that current Google apps stop asking to update Play services
// (cyclon/reported-gms-version.md).
ext.cyclonValidateVersion = { Map release, int vendingCode ->
    def tag = (release.upstreamTag ?: '') =~ /^v0\.\d+\.(\d+)\.(\d+)$/
    def reported = (release.reportedGmsVersion ?: '') =~ /^\d{2}\.\d{2}\.\d{2}$/
    if (release.format != 2 || !tag.matches() || !reported.matches()) {
        throw new GradleException('Cyclon version allocation does not match the expected format')
    }
    int upstreamMinor = Integer.parseInt(tag.group(1))
    int upstreamGmsCode = Integer.parseInt(tag.group(2))
    int gmsCode = Integer.parseInt(release.reportedGmsVersion.replaceAll('\\.', ''))
    if (gmsCode < upstreamGmsCode) {
        throw new GradleException('Cyclon reportedGmsVersion allocation is older than the upstream release')
    }
    def allocations = [
        [name: 'gmsVersionCode', base: gmsCode * 1000, width: 1000],
        // The first 100-code delivery block is exhausted at installed 84022699.
        // Reserve the next block for the same pinned 40.2.26 compatibility version;
        // revisit this allocation when the upstream vending version changes.
        [name: 'vendingVersionCode', base: 80000000 + vendingCode * 100, width: (vendingCode == 40226 ? 200 : 100)]
    ]
    allocations.each { allocation ->
        def value = release[allocation.name]
        if (!(value instanceof Integer) || value <= allocation.base + upstreamMinor * 2 ||
                value >= allocation.base + allocation.width) {
            throw new GradleException("Invalid Cyclon ${allocation.name} allocation for the pinned upstream release")
        }
    }
    return release + [gmsVersion: release.reportedGmsVersion, gmsCode: gmsCode]
}

ext.cyclonVersion = { int vendingCode ->
    cyclonValidateVersion(new JsonSlurper().parse(rootProject.file('cyclon/version.json')), vendingCode)
}
